[package]
name = "aeopin-authority"
version = "0.1.0"
edition = "2021"

[dependencies]
# UI Framework
slint = "1.7.0"

# Networking & Updates
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Archive handling
zip = "2.2"

# File hashing
sha2 = "0.10"

# Windows Integration
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Security",
] }

# Process management
sysinfo = "0.31"

# Logging
log = "0.4"
env_logger = "0.11"

[build-dependencies]
slint-build = "1.7.0"
